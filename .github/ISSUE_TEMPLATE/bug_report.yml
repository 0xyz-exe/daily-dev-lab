name: Bug Report
description: File a bug report for daily-dev-lab automation
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

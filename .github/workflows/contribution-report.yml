name: Contribution Report

on:
  schedule:
    - cron: '30 2 * * 0' # Weekly Sunday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate summary report
        run: pnpm run report

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-contribution-summary
          path: reports/LATEST_SUMMARY.md
          retention-days: 30
